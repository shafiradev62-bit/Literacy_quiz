<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Pencil cursor, tip at (7,7) → hotspot 7 7 -->
  <g transform="rotate(-45 16 16)">
    <!-- Graphite tip -->
    <polygon points="16,3 20,11 12,11" fill="#2D2D2D"/>
    <polygon points="16,5 18,10 16,10" fill="#5A5A5A" opacity="0.5"/>
    <!-- Yellow body -->
    <rect x="12" y="11" width="8" height="13" rx="1" fill="#FFD700" stroke="#D97706" stroke-width="1"/>
    <rect x="13.4" y="11" width="2" height="13" fill="#FBBF24" opacity="0.6"/>
    <!-- Wood grain -->
    <line x1="12" y1="15" x2="20" y2="15" stroke="#D97706" stroke-width="0.4" opacity="0.5"/>
    <line x1="12" y1="19" x2="20" y2="19" stroke="#D97706" stroke-width="0.4" opacity="0.5"/>
    <!-- Metal ferrule -->
    <rect x="11.5" y="24" width="9" height="3" rx="0.8" fill="#C0C0C0" stroke="#9CA3AF" stroke-width="0.7"/>
    <rect x="12.5" y="24.4" width="7" height="0.9" fill="#FFFFFF" opacity="0.35" rx="0.4"/>
    <!-- Eraser -->
    <rect x="12" y="27" width="8" height="4" rx="2" fill="#FF91B8" stroke="#F472B6" stroke-width="0.7"/>
    <rect x="13" y="27.8" width="3" height="1.2" fill="#FFFFFF" opacity="0.4" rx="0.5"/>
    <!-- Outline -->
    <polygon points="16,3 20,11 12,11" fill="none" stroke="#1F2937" stroke-width="1" stroke-linejoin="round"/>
    <rect x="12" y="11" width="8" height="20" rx="1.3" fill="none" stroke="#1F2937" stroke-width="1"/>
  </g>
</svg>
