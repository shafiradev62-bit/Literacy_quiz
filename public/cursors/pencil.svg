<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Cartoon pencil cursor - tip at top-left (hotspot 2,2) -->
  <!-- Rotated 45deg so tip points top-left -->
  <g transform="translate(2,2) rotate(-45 18 18)">
    <!-- Drop shadow -->
    <g opacity="0.18" transform="translate(2,2)">
      <polygon points="18,1 22,10 14,10" fill="#000"/>
      <rect x="14" y="10" width="8" height="18" rx="1" fill="#000"/>
      <rect x="13" y="27" width="10" height="3" rx="0.5" fill="#000"/>
      <rect x="14" y="30" width="8" height="5" rx="1.5" fill="#000"/>
    </g>
    <!-- Graphite tip (dark grey) -->
    <polygon points="18,1 22,10 14,10" fill="#2D2D2D"/>
    <!-- Highlight on tip -->
    <polygon points="18,3 20,8 18,8" fill="#5A5A5A" opacity="0.5"/>
    <!-- Pencil body - yellow with thick outline -->
    <rect x="14" y="10" width="8" height="18" rx="1" fill="#FFD700" stroke="#D97706" stroke-width="1.2"/>
    <!-- Body shading stripe -->
    <rect x="15.5" y="10" width="2" height="18" fill="#FBBF24" opacity="0.6"/>
    <!-- Wood grain lines -->
    <line x1="14" y1="14" x2="22" y2="14" stroke="#D97706" stroke-width="0.4" opacity="0.5"/>
    <line x1="14" y1="18" x2="22" y2="18" stroke="#D97706" stroke-width="0.4" opacity="0.5"/>
    <line x1="14" y1="22" x2="22" y2="22" stroke="#D97706" stroke-width="0.4" opacity="0.5"/>
    <!-- Metal ferrule band -->
    <rect x="13" y="27" width="10" height="3.5" rx="0.8" fill="#C0C0C0" stroke="#9CA3AF" stroke-width="0.8"/>
    <!-- Ferrule highlight -->
    <rect x="14" y="27.5" width="8" height="1" fill="white" opacity="0.35" rx="0.4"/>
    <!-- Eraser (pink) -->
    <rect x="14" y="30" width="8" height="6" rx="2" fill="#FF91B8" stroke="#F472B6" stroke-width="0.8"/>
    <!-- Eraser shine -->
    <rect x="15" y="31" width="3" height="1.5" fill="white" opacity="0.4" rx="0.5"/>
    <!-- Outline around whole pencil -->
    <polygon points="18,1 22,10 14,10" fill="none" stroke="#1F2937" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="14" y="10" width="8" height="24" rx="1.5" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  </g>
</svg>
